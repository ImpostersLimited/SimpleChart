name: Documentation

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "Package.swift"
      - "README.md"
      - "Sources/**"
      - "Tests/**"
      - "docs/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "Package.swift"
      - "README.md"
      - "Sources/**"
      - "Tests/**"
      - "docs/**"

jobs:
  docbuild:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show stable toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build package without warnings
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run package tests
        run: swift test

      - name: Build DocC catalog
        run: |
          xcodebuild docbuild \
            -scheme SimpleChart \
            -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
